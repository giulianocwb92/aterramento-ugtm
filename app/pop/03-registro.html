<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#1d5bbf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="POP UGTM">
<link rel="apple-touch-icon" href="../assets/icons/icon-180.png">
<link rel="icon" href="../assets/icons/icon-192.png">
<title>Registro — POP Aterramento UGTM</title>
<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="../shared/css/layout.css">
<link rel="stylesheet" href="../shared/css/components.css">
<link rel="stylesheet" href="../shared/css/wizard.css">
</head>
<body>
<div id="topbar-mount"></div>
<div id="progress-mount"></div>

<div class="app-body">
<div class="sidebar-col" id="sidebar-mount"></div>
<div class="content-col">
<div class="main" style="padding-top:1.75rem;">

  <div class="section" id="registro">
    <div class="section-title"><span class="sec-num">08</span>Registro da operação</div>

    <div class="registro-form">
      <div class="form-grid">
        <div class="form-row">
          <label for="r-data">Data</label>
          <input class="form-input" type="date" id="r-data">
        </div>
        <div class="form-row">
          <label for="r-hora">Hora de início</label>
          <input class="form-input" type="time" id="r-hora">
        </div>
        <div class="form-row form-row-full">
          <label for="r-local">Local / identificação da UGTM</label>
          <input class="form-input" type="text" id="r-local" placeholder="Ex: UGTM-042 · Subestação Curitiba Norte">
        </div>
        <div class="form-row">
          <label for="r-rho">ρ medido (Ω·m)</label>
          <input class="form-input" type="number" id="r-rho" placeholder="76">
          <div class="form-hint" id="r-rho-hint">Preenchido automaticamente a partir da página Tabela de solo.</div>
        </div>
        <div class="form-row">
          <label for="r-rg">Rg medido (Ω)</label>
          <input class="form-input" type="number" id="r-rg" placeholder="8.5" step="0.1">
          <div class="form-hint" id="r-rg-hint">Preenchido automaticamente a partir do procedimento.</div>
        </div>
        <div class="form-row">
          <label for="r-config">Configuração utilizada</label>
          <select class="form-input" id="r-config">
            <option value="">Selecionar</option>
            <option value="primaria">Primária — 4 hastes</option>
            <option value="secundaria">Secundária — 6 hastes</option>
          </select>
        </div>
        <div class="form-row">
          <label for="r-bentonita">Bentonita aplicada</label>
          <select class="form-input" id="r-bentonita">
            <option value="">Selecionar</option>
            <option value="nao">Não</option>
            <option value="sim">Sim</option>
          </select>
        </div>
        <div class="form-row form-row-full">
          <label for="r-resp">Responsável técnico</label>
          <input class="form-input" type="text" id="r-resp" placeholder="Nome e matrícula">
        </div>
        <div class="form-row form-row-full">
          <label for="r-obs">Observações</label>
          <input class="form-input" type="text" id="r-obs" placeholder="Condições do solo, intercorrências, etc.">
        </div>
      </div>

      <button class="btn-exportar" id="btn-exportar">Gerar registro para copiar</button>
      <button class="btn-limpar" id="btn-limpar">Limpar formulário</button>

      <div class="export-preview" id="export-preview"></div>
      <button class="btn-copiar" id="btn-copiar" style="display:none;">Copiar registro</button>
    </div>
  </div>

  <div id="wizard-footer-mount"></div>
</div>
</div>
</div>

<script src="../shared/js/pwa.js"></script>
<script>window.Ugtm.PWA.init('../');</script>
<script src="../shared/js/state.js"></script>
<script src="../shared/js/chrome.js"></script>
<script src="../shared/js/theme.js"></script>
<script src="../shared/js/wizard.js"></script>
<script src="../shared/js/hub.js"></script>
<script src="../shared/js/registro.js"></script>
<script>
  window.Ugtm.Wizard.guard('registro','../');
  window.Ugtm.Chrome.render({mode:'pop', activeId:'registro', basePath:'../'});
  window.Ugtm.Wizard.renderProgress('progress-mount','registro');
  window.Ugtm.Registro.init();
  window.Ugtm.Wizard.renderFooter('wizard-footer-mount', {pageId:'registro', basePath:'../', canAdvance:function(){return {ok:true};}});
</script>
</body>
</html>
